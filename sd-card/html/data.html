<!DOCTYPE html>
<html lang="en" xml:lang="en"> 
    <head>
    <link rel="stylesheet" href="app.css?v=$COMMIT_HASH" type="text/css">
    <link rel="stylesheet" href="theme.css?v=$COMMIT_HASH" type="text/css">
    <script src="theme.js?v=$COMMIT_HASH"></script>
    <script type="text/javascript" src="app.js?v=$COMMIT_HASH"></script>

        <title>Data Viewer</title>
        <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <style>
            h1 {font-size: 2em;}
            h2 {font-size: 1.5em; margin-block-start: 0.0em; margin-block-end: 0.2em;}
            h3 {font-size: 1.2em;}
            p {font-size: 1em;}

            html,
            body {
                height: 100%;
                margin: 1px;
                font-family: Arial, Helvetica, sans-serif;
            }

            .box {
                display: flex;
                flex-flow: column;
                height: 99.75%;
                box-sizing: border-box;
                background: var(--panel, #fff);
                border: 1px solid var(--border, #ddd);
                border-radius: 8px;
                padding: 10px;
            }

            .box .row.header {
                flex: 0 1 auto;
            }

            .box .row.content {
                flex: 1 1 auto;
            }

            .box .row.footer {
                flex: 0 1 auto;
            }

            #data {
                font-size: small;
                overflow: auto;
            }

            #data table {
                border-collapse: collapse;
                width: 100%;
                font-family: 'Courier New', Courier, monospace;
                font-size: small;
            }

            #data th {
                position: sticky;
                top: 0;
                background: var(--panel, #f0f2f4);
                text-align: left;
                padding: 3px 8px;
                border-bottom: 2px solid var(--border, #bbb);
                white-space: nowrap;
            }

            #data td {
                padding: 2px 8px;
                border-bottom: 1px solid var(--border, #e2e2e2);
                white-space: nowrap;
            }

            #data td.st-ok { color: var(--muted, #6a737b); }
            #data td.st-note { color: #b7791f; font-weight: bold; }   /* accepted with an override note */
            #data td.st-err { color: #c0392b; font-weight: bold; }    /* rejected reading */

            .button {
                padding: 5px 10px;
                width: 160px;
                font-size: 16px;
            }
        </style>
        <script type="text/javascript" src="common.js?v=$COMMIT_HASH"></script> 
    </head>
    <body>
<div class="app-container">
            <h2>Data Viewer</h2>
            <h4>Today's latest data</h4>
        <div class="box">
            <div class="row header">
                <button class="button" onClick="reload();">Refresh</button>
                <button class="button" onClick="window.open(getDomainname() + '/datafileact');">Show Full File</button>
                <button class="button" onClick="window.location.href = getDomainname() + '/fileserver/log/data/'">Show Data Files</button>
                <button class="button" onClick="window.location.href = 'graph.html?v=$COMMIT_HASH'">Show Graph</button>
            </div>
            <div class="row content" id="data"><br><br><br><b>Loading data file, please wait...</b></div>
            <div class="row footer">
                <button class="button" onClick="reload();">Refresh</button>
                <button class="button" onClick="window.open(getDomainname() + '/datafileact');">Show Full File</button>
                <button class="button" onClick="window.location.href = getDomainname() + '/fileserver/log/data/'">Show Data Files</button>
                <button class="button" onClick="window.location.href = 'graph.html?v=$COMMIT_HASH'">Show Graph</button>
            </div>
          </div>
    </div>
</body>

    <script>  
        function reload() {
            document.getElementById('data').innerHTML += "<br><b>Reloading...<b><br><br>";
            window.scrollBy(0,document.body.scrollHeight);
            funcRequest(getDomainname() + '/data');
        } 

        // Data-file columns (see ClassFlowPostProcessing::WriteDataLog / ClassLogFile::WriteToData):
        // 8 fixed fields, then one column per ROI readout (digits first, then analog).
        var CSV_COLUMNS = ["Time", "Sequence", "Raw Value", "Value", "Previous Value",
                           "Rate", "Change", "Status", "ROI Readouts"];

        function esc(t) {
            return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function renderTable(data) {
            var h = "<table><tr>";
            CSV_COLUMNS.forEach(function (c) { h += "<th>" + c + "</th>"; });
            h += "</tr>";
            data.split("\n").forEach(function (line) {
                line = line.trim();
                if (!line) return;
                var f = line.split(",");
                if (f.length < 8) {   // unexpected format: show the raw line rather than losing it
                    h += '<tr><td colspan="' + CSV_COLUMNS.length + '">' + esc(line) + "</td></tr>";
                    return;
                }
                // Status colour: plain "no error" = OK; "no error - ..." = accepted with an override
                // note (confidence vote / rate accepted on confident reads); anything else = rejected.
                var st = f[7];
                var cls = (st === "no error") ? "st-ok" : (st.indexOf("no error") === 0 ? "st-note" : "st-err");
                h += "<tr>";
                for (var i = 0; i < 7; i++) h += "<td>" + esc(f[i]) + "</td>";
                h += '<td class="' + cls + '">' + esc(st) + "</td>";
                h += "<td>" + esc(f.slice(8).join(" ")) + "</td></tr>";
            });
            return h + "</table>";
        }

        async function funcRequest(url){
            await fetch(url)
            .then((res) => {
                if (!res.ok) {
                    document.getElementById("data").innerHTML = "HTTP error " + res.status;
                }

                return res.text();
            })
            .then((data) => {
                document.getElementById('data').innerHTML = renderTable(data);

                window.scrollBy(0,document.body.scrollHeight);

            })
            .catch((err) => {
                document.getElementById("data").innerHTML = err;
            });
        }

        funcRequest(getDomainname() + '/data');

    </script>
</html>
