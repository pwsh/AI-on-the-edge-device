<!DOCTYPE html>
<html lang="en" xml:lang="en"> 
    <head>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="app.css?v=$COMMIT_HASH" type="text/css">
    <link rel="stylesheet" href="theme.css?v=$COMMIT_HASH" type="text/css">
    <script src="theme.js?v=$COMMIT_HASH"></script>
    <script type="text/javascript" src="app.js?v=$COMMIT_HASH"></script>

        <title>Log Viewer</title>
        
        <style>
            html,
            body {
                height: 100%;
                margin: 1px;
            }

            .box {
                display: flex;
                flex-flow: column;
                height: 99.75%;
                box-sizing: border-box;
                background: var(--panel, #fff);
                border: 1px solid var(--border, #ddd);
                border-radius: 8px;
                padding: 10px;
            }

            .box .row.header {
                flex: 0 1 auto;
            }

            .box .row.content {
                flex: 1 1 auto;
            }

            .box .row.footer {
                flex: 0 1 auto;
            }

            #log {
                font-family: 'Courier New', Courier, monospace;
                font-size: small;
            }

            .button {
                padding: 5px 10px;
                width: 190px;
                font-size: 16px;
            }
        </style>
        <script type="text/javascript" src="common.js?v=$COMMIT_HASH"></script> 
    </head>
    <body>
<div class="app-container">
        <div class="box">
            <div class="row header">
                <button class="button" onClick="reload();">Reload</button>
                <button class="button" onClick="window.open(getDomainname() + '/logfileact');">Show Full Log</button>
                <button class="button" onClick="window.location.href = getDomainname() + '/fileserver/log/message/'">Show Older Log Files</button>
                <label style="font-size:16px; margin-left:10px;" title="Automatically refresh the log and scroll to the newest entries">
                    <input type="checkbox" id="liveToggle" onchange="toggleLive();"> Live (auto-scroll)
                </label>
            </div>
            <div class="row content" id="log"><br><br><br><b>Loading logfile, please wait...</b></div>
            <div class="row footer">
                <button class="button" onClick="reload();">Reload</button>
                <button class="button" onClick="window.open(getDomainname() + '/logfileact');">Show Full Log</button>
                <button class="button" onClick="window.location.href = getDomainname() + '/fileserver/log/message/'">Show Older Log Files</button>
            </div>
          </div>
    </div>
</body>

    <script>
        var liveTimer = null;
        var LIVE_INTERVAL_MS = 3000;

        function reload() {
          //  document.getElementById('log').innerHTML += "<br><b>Reloading...<b><br><br>";
            document.getElementById('log').innerHTML += "<b>Reloading...</b>";
            window.scrollBy(0,document.body.scrollHeight);
            funcRequest(getDomainname() + '/log');
        }

        function toggleLive() {
            var on = document.getElementById('liveToggle').checked;
            if (on) {
                // Refresh immediately, then keep polling while enabled.
                funcRequest(getDomainname() + '/log');
                if (liveTimer === null) {
                    liveTimer = setInterval(function () {
                        funcRequest(getDomainname() + '/log');
                    }, LIVE_INTERVAL_MS);
                }
            } else if (liveTimer !== null) {
                clearInterval(liveTimer);
                liveTimer = null;
            }
        }

        // Stop polling when the page/tab is hidden or unloaded to save resources.
        document.addEventListener('visibilitychange', function () {
            if (document.hidden && liveTimer !== null) {
                clearInterval(liveTimer);
                liveTimer = null;
            } else if (!document.hidden && document.getElementById('liveToggle').checked && liveTimer === null) {
                toggleLive();
            }
        });


        function processLogLine(line, index, arr) {
            /* Make sure the whitespaces in the uptime field get persevered */
            uptimePart = line.slice(0, line.indexOf("]")).replace(/ /g, "&nbsp;");
            line = uptimePart + line.slice(line.indexOf("]"))

            if (line.includes("&lt;WRN&gt;")) {
                arr[index] = "<span style=\"color:#e83c00\">" + line + "</span>";
            }
            else if (line.includes("&lt;ERR&gt;")) {
                arr[index] = "<span style=\"color:red\"><b>" + line + "</b></span>";
            }
            else if (line.includes("&lt;DBG&gt;")) {
                arr[index] = "<span style=\"color:gray\">" + line + "</span>";
            }
            else {
                arr[index] = line;
            }

            arr[index] += "<br>";
        }

        async function funcRequest(url){
            await fetch(url)
            .then((res) => {
                if (!res.ok) {
                    document.getElementById("log").innerHTML = "HTTP error " + res.status;
                }

                return res.text();
            })
            .then((log) => {
                log = log.replace(/</g, "&lt;");
                log = log.replace(/>/g, "&gt;");
                logArr = log.split("\n");
                logArr.forEach(processLogLine);

                document.getElementById('log').innerHTML = "<br>" + logArr.join("\n") + "&nbsp;";

                window.scrollBy(0,document.body.scrollHeight);

            })
            .catch((err) => {
                document.getElementById("log").innerHTML = err;
            });
        }

        funcRequest(getDomainname() + '/log');

    </script>
</html>
