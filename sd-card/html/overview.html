<!DOCTYPE html>
<html lang="en" xml:lang="en"> 
<head>
    <link rel="stylesheet" href="app.css?v=$COMMIT_HASH" type="text/css">
    <link rel="stylesheet" href="theme.css?v=$COMMIT_HASH" type="text/css">
    <script src="theme.js?v=$COMMIT_HASH"></script>
    <script src="app.js?v=$COMMIT_HASH"></script>

<title>Overview</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
	.ov-wrap { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
	.ov-info { flex: 1 1 340px; min-width: 280px; display: flex; flex-direction: column; }
	.ov-img  { flex: 1 1 360px; min-width: 280px; }
	.ov-img img { width: 100%; height: auto; display: block; border-radius: 6px; }
	.ov-info .app-card { margin-bottom: 12px; }
	.ov-card-title { margin: 0 0 6px; font-size: 0.78em; text-transform: uppercase;
		letter-spacing: 0.05em; color: var(--muted, #5a636b); font-weight: 700; }
	#value { font-size: 1.6em; font-weight: 600; }
	.ov-sysinfo > div, .ov-sysinfo > span { display: block; margin: 2px 0; font-size: 0.95em; }
	/* Brief flash on a digit that changed since the previous refresh. */
	.digit-changed { border-radius: 3px; padding: 0 1px; animation: digitFlash 1.4s ease-out; }
	@keyframes digitFlash { 0% { background: #ffd24d; } 100% { background: transparent; } }
	html[data-theme="dark"] .digit-changed { animation: digitFlashDark 1.4s ease-out; }
	@keyframes digitFlashDark { 0% { background: #7a5a00; } 100% { background: transparent; } }

	/* Per-digit confident-read matrix (most recent identifications per digit). */
	.dm-seq { margin-top: 8px; }
	.dm-seq h4 { margin: 6px 0 4px; font-size: .95em; }
	table.dm { border-collapse: collapse; font-family: monospace; font-size: .95em; }
	table.dm th, table.dm td { border: 1px solid rgba(127,127,127,.35); padding: 2px 7px; text-align: center; min-width: 1.6em; }
	table.dm th { font-weight: 600; }
	table.dm tr.dm-cur td { font-weight: 700; }
	table.dm td.dm-roi, table.dm th.dm-rowlabel { text-align: right; color: #888; font-weight: 400; }
	table.dm td.dm-n { color: #c0392b; font-weight: 700; }
	table.dm td.dm-blank { color: rgba(127,127,127,.4); }
	table.dm tr.dm-confrow td { font-size: .78em; }

	/* Confidence indicators (overview matrix + value cards + ROI examine). */
	.conf-badge { font-size: .72em; font-weight: 600; padding: 1px 7px; border-radius: 9px; vertical-align: middle; white-space: nowrap; }
	.val-conf { font-size: .8em; font-weight: 600; margin-top: 3px; }
	.conf-high { color: #1f9d55; }
	.conf-mid  { color: #b7791f; }
	.conf-low  { color: #c0392b; }
	.conf-badge.conf-high { background: rgba(31,157,85,.14); }
	.conf-badge.conf-mid  { background: rgba(183,121,31,.16); }
	.conf-badge.conf-low  { background: rgba(192,57,43,.14); }
</style>

</head>

<body style="font-family: arial">

	<div class="app-container">
		<div class="ov-wrap">
			<div class="ov-info">
				<div class="app-card"><div class="ov-card-title">Value</div><div id="value"></div></div>
				<div class="app-card"><div class="ov-card-title">Previous Value</div><div id="prevalue"></div></div>
				<div class="app-card"><div class="ov-card-title">Raw Value</div><div id="raw"></div></div>
				<div class="app-card"><div class="ov-card-title">Value Status</div><div id="error"></div></div>
				<div class="app-card"><div class="ov-card-title">Process State</div><div id="statusflow"></div></div>
				<div class="app-card ov-sysinfo"><div class="ov-card-title">Analysis</div>
					<div id="an_type"></div>
					<div id="an_proc"></div>
					<div id="an_done"></div>
					<div id="an_nalign"></div>
					<div id="an_nread"></div>
				</div>
				<div class="app-card ov-sysinfo"><div class="ov-card-title">System Info</div>
					<div id="sntp_date"></div>
					<div id="timestamp"></div>
					<div id="cputemp"></div>
					<div id="rssi"></div>
					<div><span id="uptime"></span> <span id="round"></span></div>
				</div>
			</div>
			<div class="ov-img app-card">
				<img id="img" src="" alt="Latest processed image">
				<label style="display:block; margin-top:6px; font-size:.9em; color:#888; cursor:pointer;">
					<input type="checkbox" id="showRoiOverlayCb" onclick="toggleRoiOverlay()"> Show ROI overlay boxes
				</label>
			</div>
		</div>
		<div id="digitmatrix"></div>
	</div>

	<script type="text/javascript" src="jquery-3.6.0.min.js?v=$COMMIT_HASH"></script>
	<script type="text/javascript" src="common.js?v=$COMMIT_HASH"></script> 
	<script type="text/javascript" src="readconfigcommon.js?v=$COMMIT_HASH"></script>
	<script type="text/javascript" src="readconfigparam.js?v=$COMMIT_HASH"></script>
	
	<script type="text/javascript">
		function addZero(i) {
			if (i < 10) {
				i = "0" + i;
			}
			return i;
		}

		// Append a unique parameter so the browser can't serve a cached response. The live data
		// endpoints (/value, /statusflow, /digit_matrix, /info) don't send Cache-Control, so without
		// this the values freeze on screen even though the device keeps returning fresh readings.
		function noCache(u) {
			return u + (u.indexOf("?") >= 0 ? "&" : "?") + "_nc=" + Date.now();
		}

		$(document).ready(function() {
			var _cb = document.getElementById('showRoiOverlayCb');
			if (_cb) { _cb.checked = (localStorage.getItem('showRoiOverlay') !== 'false'); }
			LoadData();
			LoadROIImage();
		});

		// Toggle the ROI overlay boxes on the overview image (remembered per-browser, no reboot).
		function toggleRoiOverlay() {
			localStorage.setItem('showRoiOverlay',
				document.getElementById('showRoiOverlayCb').checked ? 'true' : 'false');
			LoadROIImage();
		}

		function LoadData(){
			loadValue("value", "value", "border-collapse: collapse; width: 100%");
			loadValue("raw", "raw", "border-collapse: collapse; width: 100%");
			loadValue("prevalue", "prevalue", "border-collapse: collapse; width: 100%");
			loadValue("error", "error", "border-collapse: collapse; width: 100%");
			loadDigitMatrix();
			loadStatus();
			loadDiagnostics();
			loadSntpDate();
			loadCPUTemp();
			loadRSSI();
			loadUptime();
			loadRoundCounter();
		}

		// Refresh the value/diagnostics/image (not the slower system-info bits) when state changes.
		function RefreshReadings() {
			loadValue("value", "value", "border-collapse: collapse; width: 100%");
			loadValue("raw", "raw", "border-collapse: collapse; width: 100%");
			loadValue("prevalue", "prevalue", "border-collapse: collapse; width: 100%");
			loadValue("error", "error", "border-collapse: collapse; width: 100%");
			loadDigitMatrix();
			loadDiagnostics();
			loadRoundCounter();
			LoadROIImage();
		}

		function loadDiagnostics() {
			url = domainname + '/info?type=Diagnostics';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					try {
						var d = JSON.parse(xhttp.responseText);
						var typ = d.analysisType;
						if (parseInt(d.digitsTotal, 10) > 0) {
							typ += " (" + d.digitsAnalyzed + "/" + d.digitsTotal + " digits)";
						}
						$('#an_type').html("Last analysis: " + typ);
						$('#an_proc').html("Time to complete: " + d.processingTimeMs + " ms");
						$('#an_done').html("Last completed: " + d.lastAnalysisCompleted);
						$('#an_nalign').html("Next full alignment: " + d.nextFullAlignment);
						$('#an_nread').html("Next full analysis: " + d.nextFullAnalysis);
					} catch (e) { }
				}
			}
			xhttp.open("GET", noCache(url), true);
			xhttp.send();
		}

		function LoadROIImage(){
			var d = new Date();
			var timestamp = d.getTime();
			var h = addZero(d.getHours());
			var m = addZero(d.getMinutes());
			var s = addZero(d.getSeconds());
			// Show ROI overlay boxes (alg_roi.jpg) or the plain aligned image (alg.jpg). Default on.
			var _imgName = (localStorage.getItem('showRoiOverlay') !== 'false') ? 'alg_roi.jpg' : 'alg.jpg';
			document.getElementById("img").src = getDomainname() + '/img_tmp/' + _imgName + '?timestamp=' + timestamp;
			$('#timestamp').html("Last Page Refresh:" + (h + ":" + m + ":" + s));
		}

		var lastStatusText = null;

		function Refresh() {
			// Periodic full refresh every 10s, plus a lightweight status poll every ~2.5s that
			// refreshes the readings/diagnostics/image immediately whenever the process state changes.
			setInterval(function() {
				LoadData();
				LoadROIImage();
			}, 10000);
			setInterval(loadStatus, 2500);
		}

		function loadStatus() {
			url = domainname + '/statusflow';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#statusflow').html(_rsp);
					if (lastStatusText !== null && _rsp !== lastStatusText) {
						// Process state changed -> pull fresh readings without waiting for the 10s tick.
						RefreshReadings();
					}
					lastStatusText = _rsp;
				}
			}

			xhttp.open("GET", noCache(url), true);
			xhttp.send();
		}

		function loadCPUTemp() {
			url = domainname + '/cpu_temperature';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#cputemp').html("CPU Temperature: " +_rsp + "°C");
				}
			}
			
			xhttp.open("GET", noCache(url), true);
			xhttp.send();
		}

		function loadRSSI() {
			url = domainname + '/rssi';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
				
					if (_rsp >= -55) {
						$('#rssi').html("WIFI Signal: Excellent (" + _rsp + "dBm)");
					}
					else if (_rsp < -55 && _rsp >= -67) {
						$('#rssi').html("WIFI Signal: Good (" + _rsp + "dBm)");
					}
					else if (_rsp < -67 && _rsp >= -78) {
						$('#rssi').html("WIFI Signal: Fair (" + _rsp + "dBm)");
					}
					else if (_rsp < -78 && _rsp >= -85) {
						$('#rssi').html("WIFI Signal: Weak (" + _rsp + "dBm)");
					}
					else {
						$('#rssi').html("WIFI Signal: Unreliable (" + _rsp + "dBm)");
					}
				}
			}
			
			xhttp.open("GET", noCache(url), true);
			xhttp.send();		
		}

		function loadSntpDate() {
			url = domainname + '/date';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function () {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#sntp_date').html("Date/Time on device: " + _rsp);
				}
			}

			xhttp.open("GET", noCache(url), true);
			xhttp.send();
		}

		function loadUptime() {
			url = domainname + '/uptime';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#uptime').html("Uptime: " + _rsp);
				}
			}
			
			xhttp.open("GET", noCache(url), true);
			xhttp.send();
		}

		function loadRoundCounter() {
			url = domainname + '/info?type=Round';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#round').html("(Round: " + _rsp + ")");
				}
			}
			
			xhttp.open("GET", noCache(url), true);
			xhttp.send();
		}

		var _prevValueText = {};   // key -> previously rendered value string (for change highlight)

		// Wrap each digit that changed since the previous render in a flashing span. Never flashes on
		// the first render. Plain text is HTML-escaped. The key identifies the cell (card + number name)
		// so every meter/number tracks its own digits independently.
		function highlightChangedDigits(_key, txt) {
			var prev = _prevValueText[_key];
			var html = "";
			for (var i = 0; i < txt.length; i++) {
				var c = txt[i];
				var esc = c === "<" ? "&lt;" : c === ">" ? "&gt;" : c === "&" ? "&amp;" : c;
				var changed = (prev !== undefined) && (i >= prev.length || prev[i] !== c) && /[0-9]/.test(c);
				html += changed ? ("<span class=\"digit-changed\">" + esc + "</span>") : esc;
			}
			_prevValueText[_key] = txt;
			return html;
		}

		// Per-digit confident-read matrix: shows, below each configured number sequence, the most
		// recent identifications for every digit (newest first), so the raw recognition can be seen.
		function dmEsc(s) { return String(s).replace(/[&<>]/g, function(c){ return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;'; }); }
		var _seqConf = {};   // per-number confidence (percent), shared with the Value card
		function confClass(c) { return (typeof c !== 'number' || c < 0) ? '' : (c >= 90 ? 'conf-high' : (c >= 70 ? 'conf-mid' : 'conf-low')); }
		function confText(c)  { return (typeof c === 'number' && c >= 0) ? (c + '%') : '—'; }
		function loadDigitMatrix() {
			var url = getDomainname() + '/digit_matrix';
			var x = new XMLHttpRequest();
			x.onreadystatechange = function() {
				if (this.readyState != 4 || this.status != 200) return;
				var data;
				try { data = JSON.parse(x.responseText); } catch (e) { return; }
				var host = document.getElementById('digitmatrix');
				var seqs = Object.keys(data);
				if (!seqs.length) { host.innerHTML = ''; return; }
				var html = '<div class="app-card"><div class="ov-card-title">Digit matrix (recent identifications)</div>';
				var any = false;
				_seqConf = {};
				for (var s = 0; s < seqs.length; s++) {
					var seq = data[seqs[s]];
					var digits = (seq && seq.digits) ? seq.digits : [];
					if (!digits.length) continue;
					any = true;
					var conf = (seq && typeof seq.confidence === 'number') ? seq.confidence : -1;
					_seqConf[seqs[s]] = conf;
					var maxh = 0;
					for (var d = 0; d < digits.length; d++) maxh = Math.max(maxh, (digits[d].hist || []).length);
					// Per-sequence confidence shown above the matrix.
					html += '<div class="dm-seq"><h4>' + dmEsc(seqs[s]) +
					        ' <span class="conf-badge ' + confClass(conf) + '">confidence ' + confText(conf) + '</span></h4><table class="dm">';
					html += '<tr class="dm-cur"><th class="dm-rowlabel">now</th>';
					for (var d = 0; d < digits.length; d++) {
						var cur = digits[d].cur;
						html += (cur === 'N' || cur === null) ? '<td class="dm-n">N</td>' : '<td>' + dmEsc(cur) + '</td>';
					}
					html += '</tr>';
					// Per-digit confidence row.
					html += '<tr class="dm-confrow"><th class="dm-rowlabel">conf</th>';
					for (var d = 0; d < digits.length; d++) {
						html += '<td class="' + confClass(digits[d].conf) + '">' + confText(digits[d].conf) + '</td>';
					}
					html += '</tr>';
					for (var r = 0; r < maxh; r++) {
						html += '<tr><th class="dm-rowlabel">-' + (r + 1) + '</th>';
						for (var d = 0; d < digits.length; d++) {
							var h = digits[d].hist || [];
							html += (r < h.length) ? '<td>' + dmEsc(h[r]) + '</td>' : '<td class="dm-blank">·</td>';
						}
						html += '</tr>';
					}
					html += '</table></div>';
				}
				html += '</div>';
				host.innerHTML = any ? html : '';
			};
			x.open('GET', noCache(url), true);
			x.send();
		}

		function loadValue(_type, _div, _style) {
			url = domainname + '/value?all=true&type=' + _type;     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					var _split = _rsp.split("\r");
					
					if (typeof _style == undefined) {
						out = "<table>";
					}
					else {
						out = "<table style=\"" + _style + "\">";
					}

					if (_split.length == 1) {
						var _zer = ZerlegeZeile(_split[0], "\t")
					
						if (_zer.length > 1) {
							out = _zer[1];
						}
						else {
							out = "";
						}
					}
					else {
						for (var j = 0; j < _split.length; ++j) {
							var _zer = ZerlegeZeile(_split[j], "\t")
						
							if (_zer.length == 1) {
								out = out + "<tr><td style=\"width: 22%; padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\">" + 
								_zer[0] + "</td><td style=\"padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\"> </td></tr>"; 
							}
							else {
								var _nm = _zer[0].replace(/\s/g, "");
								var _valCell = highlightChangedDigits(_div + "|" + _nm, _zer[1]);
								// Below the reading: the most recent reading's confidence (Value card only).
								var _confLine = "";
								if (_div === "value" && typeof _seqConf[_nm] === "number" && _seqConf[_nm] >= 0) {
									_confLine = "<div class=\"val-conf " + confClass(_seqConf[_nm]) + "\">confidence " + _seqConf[_nm] + "%</div>";
								}
								out = out + "<tr><td style=\"width: 22%; padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\">" +
								_zer[0] + "</td><td style=\"padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\" >" + _valCell + _confLine + "</td></tr>";
							}
						}
						out = out + "</table>"
					}
				// Single-value cards (value/prevalue/raw): flash the digits that changed since the last
				// refresh. Table (multi-number) output is set as-is.
				if (_split.length == 1 && typeof out === "string" && out !== "" && out.indexOf("<table") === -1) {
					document.getElementById(_div).innerHTML = highlightChangedDigits(_div, out);
				} else {
					document.getElementById(_div).innerHTML = out;
				}
				}
			};
			
			xhttp.open("GET", noCache(url), true);
			xhttp.send();		
		}

		/* 
		function setImageMaxWidth() {
			loadConfig(domainname); 
			ParseConfig();
			param = getConfigParameters();
			
			if(param["TakeImage"]["CamFrameSize"].value == "QVGA") {
				document.getElementById("img").style.maxWidth = "320px";
			}
			else {
				document.getElementById("img").style.maxWidth = "640px";
			}
		}
		*/
		function init(){
			domainname = getDomainname();
			// setImageMaxWidth(); // CamFrameSize was replaced by zoom - CamFrameSize is no longer needed/used for zoom 
			Refresh();
		}

		init();

	</script>
</body>
</html>
