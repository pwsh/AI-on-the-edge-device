<!DOCTYPE html>
<html lang="en" xml:lang="en"> 
<head>
    <link rel="stylesheet" href="app.css?v=$COMMIT_HASH" type="text/css">
    <link rel="stylesheet" href="theme.css?v=$COMMIT_HASH" type="text/css">
    <script src="theme.js?v=$COMMIT_HASH"></script>
    <script src="app.js?v=$COMMIT_HASH"></script>

<title>Overview</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
	.ov-wrap { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
	.ov-info { flex: 1 1 340px; min-width: 280px; display: flex; flex-direction: column; }
	.ov-img  { flex: 1 1 360px; min-width: 280px; }
	.ov-img img { width: 100%; height: auto; display: block; border-radius: 6px; }
	.ov-info .app-card { margin-bottom: 12px; }
	.ov-card-title { margin: 0 0 6px; font-size: 0.78em; text-transform: uppercase;
		letter-spacing: 0.05em; color: var(--muted, #5a636b); font-weight: 700; }
	#value { font-size: 1.6em; font-weight: 600; }
	.ov-sysinfo > div, .ov-sysinfo > span { display: block; margin: 2px 0; font-size: 0.95em; }
</style>

</head>

<body style="font-family: arial">

	<div class="app-container">
		<div class="ov-wrap">
			<div class="ov-info">
				<div class="app-card"><div class="ov-card-title">Value</div><div id="value"></div></div>
				<div class="app-card"><div class="ov-card-title">Previous Value</div><div id="prevalue"></div></div>
				<div class="app-card"><div class="ov-card-title">Raw Value</div><div id="raw"></div></div>
				<div class="app-card"><div class="ov-card-title">Value Status</div><div id="error"></div></div>
				<div class="app-card"><div class="ov-card-title">Process State</div><div id="statusflow"></div></div>
				<div class="app-card ov-sysinfo"><div class="ov-card-title">Analysis</div>
					<div id="an_type"></div>
					<div id="an_proc"></div>
					<div id="an_done"></div>
					<div id="an_nalign"></div>
					<div id="an_nread"></div>
				</div>
				<div class="app-card ov-sysinfo"><div class="ov-card-title">System Info</div>
					<div id="sntp_date"></div>
					<div id="timestamp"></div>
					<div id="cputemp"></div>
					<div id="rssi"></div>
					<div><span id="uptime"></span> <span id="round"></span></div>
				</div>
			</div>
			<div class="ov-img app-card">
				<img id="img" src="" alt="Latest processed image">
			</div>
		</div>
	</div>

	<script type="text/javascript" src="jquery-3.6.0.min.js?v=$COMMIT_HASH"></script>
	<script type="text/javascript" src="common.js?v=$COMMIT_HASH"></script> 
	<script type="text/javascript" src="readconfigcommon.js?v=$COMMIT_HASH"></script>
	<script type="text/javascript" src="readconfigparam.js?v=$COMMIT_HASH"></script>
	
	<script type="text/javascript">
		function addZero(i) {
			if (i < 10) {
				i = "0" + i;
			}
			return i;
		}

		$(document).ready(function() {
			LoadData();
			LoadROIImage();
		});

		function LoadData(){
			loadValue("value", "value", "border-collapse: collapse; width: 100%");
			loadValue("raw", "raw", "border-collapse: collapse; width: 100%");
			loadValue("prevalue", "prevalue", "border-collapse: collapse; width: 100%");
			loadValue("error", "error", "border-collapse: collapse; width: 100%");
			loadStatus();
			loadDiagnostics();
			loadSntpDate();
			loadCPUTemp();
			loadRSSI();
			loadUptime();
			loadRoundCounter();
		}

		// Refresh the value/diagnostics/image (not the slower system-info bits) when state changes.
		function RefreshReadings() {
			loadValue("value", "value", "border-collapse: collapse; width: 100%");
			loadValue("raw", "raw", "border-collapse: collapse; width: 100%");
			loadValue("prevalue", "prevalue", "border-collapse: collapse; width: 100%");
			loadValue("error", "error", "border-collapse: collapse; width: 100%");
			loadDiagnostics();
			loadRoundCounter();
			LoadROIImage();
		}

		function loadDiagnostics() {
			url = domainname + '/info?type=Diagnostics';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					try {
						var d = JSON.parse(xhttp.responseText);
						var typ = d.analysisType;
						if (parseInt(d.digitsTotal, 10) > 0) {
							typ += " (" + d.digitsAnalyzed + "/" + d.digitsTotal + " digits)";
						}
						$('#an_type').html("Last analysis: " + typ);
						$('#an_proc').html("Time to complete: " + d.processingTimeMs + " ms");
						$('#an_done').html("Last completed: " + d.lastAnalysisCompleted);
						$('#an_nalign').html("Next full alignment: " + d.nextFullAlignment);
						$('#an_nread').html("Next full analysis: " + d.nextFullAnalysis);
					} catch (e) { }
				}
			}
			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function LoadROIImage(){
			var d = new Date();
			var timestamp = d.getTime();
			var h = addZero(d.getHours());
			var m = addZero(d.getMinutes());
			var s = addZero(d.getSeconds());
			document.getElementById("img").src = getDomainname() + '/img_tmp/alg_roi.jpg?timestamp=' + timestamp;
			$('#timestamp').html("Last Page Refresh:" + (h + ":" + m + ":" + s));
		}

		var lastStatusText = null;

		function Refresh() {
			// Periodic full refresh every 10s, plus a lightweight status poll every ~2.5s that
			// refreshes the readings/diagnostics/image immediately whenever the process state changes.
			setInterval(function() {
				LoadData();
				LoadROIImage();
			}, 10000);
			setInterval(loadStatus, 2500);
		}

		function loadStatus() {
			url = domainname + '/statusflow';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#statusflow').html(_rsp);
					if (lastStatusText !== null && _rsp !== lastStatusText) {
						// Process state changed -> pull fresh readings without waiting for the 10s tick.
						RefreshReadings();
					}
					lastStatusText = _rsp;
				}
			}

			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadCPUTemp() {
			url = domainname + '/cpu_temperature';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#cputemp').html("CPU Temperature: " +_rsp + "°C");
				}
			}
			
			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadRSSI() {
			url = domainname + '/rssi';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
				
					if (_rsp >= -55) {
						$('#rssi').html("WIFI Signal: Excellent (" + _rsp + "dBm)");
					}
					else if (_rsp < -55 && _rsp >= -67) {
						$('#rssi').html("WIFI Signal: Good (" + _rsp + "dBm)");
					}
					else if (_rsp < -67 && _rsp >= -78) {
						$('#rssi').html("WIFI Signal: Fair (" + _rsp + "dBm)");
					}
					else if (_rsp < -78 && _rsp >= -85) {
						$('#rssi').html("WIFI Signal: Weak (" + _rsp + "dBm)");
					}
					else {
						$('#rssi').html("WIFI Signal: Unreliable (" + _rsp + "dBm)");
					}
				}
			}
			
			xhttp.open("GET", url, true);
			xhttp.send();		
		}

		function loadSntpDate() {
			url = domainname + '/date';
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function () {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#sntp_date').html("Date/Time on device: " + _rsp);
				}
			}

			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadUptime() {
			url = domainname + '/uptime';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#uptime').html("Uptime: " + _rsp);
				}
			}
			
			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadRoundCounter() {
			url = domainname + '/info?type=Round';     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					$('#round').html("(Round: " + _rsp + ")");
				}
			}
			
			xhttp.open("GET", url, true);
			xhttp.send();
		}

		function loadValue(_type, _div, _style) {
			url = domainname + '/value?all=true&type=' + _type;     
			var xhttp = new XMLHttpRequest();
			xhttp.onreadystatechange = function() {
				if (this.readyState == 4 && this.status == 200) {
					var _rsp = xhttp.responseText;
					var _split = _rsp.split("\r");
					
					if (typeof _style == undefined) {
						out = "<table>";
					}
					else {
						out = "<table style=\"" + _style + "\">";
					}

					if (_split.length == 1) {
						var _zer = ZerlegeZeile(_split[0], "\t")
					
						if (_zer.length > 1) {
							out = _zer[1];
						}
						else {
							out = "";
						}
					}
					else {
						for (var j = 0; j < _split.length; ++j) {
							var _zer = ZerlegeZeile(_split[j], "\t")
						
							if (_zer.length == 1) {
								out = out + "<tr><td style=\"width: 22%; padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\">" + 
								_zer[0] + "</td><td style=\"padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\"> </td></tr>"; 
							}
							else {
								out = out + "<tr><td style=\"width: 22%; padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\">" + 
								_zer[0] + "</td><td style=\"padding: 3px 5px; text-align: left; vertical-align:middle; border: 1px solid lightgrey\" >" + _zer[1] + "</td></tr>";
							}
						}
						out = out + "</table>"
					}
				document.getElementById(_div).innerHTML = out;
				}
			};
			
			xhttp.open("GET", url, true);
			xhttp.send();		
		}

		/* 
		function setImageMaxWidth() {
			loadConfig(domainname); 
			ParseConfig();
			param = getConfigParameters();
			
			if(param["TakeImage"]["CamFrameSize"].value == "QVGA") {
				document.getElementById("img").style.maxWidth = "320px";
			}
			else {
				document.getElementById("img").style.maxWidth = "640px";
			}
		}
		*/
		function init(){
			domainname = getDomainname();
			// setImageMaxWidth(); // CamFrameSize was replaced by zoom - CamFrameSize is no longer needed/used for zoom 
			Refresh();
		}

		init();

	</script>
</body>
</html>
